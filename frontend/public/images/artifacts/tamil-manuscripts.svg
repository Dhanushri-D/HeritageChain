<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Tamil Palm-Leaf Manuscript Olai Chuvadi">
  <defs>
    <linearGradient id="teakTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3222" />
      <stop offset="100%" stop-color="#24160D" />
    </linearGradient>
    <linearGradient id="palmLeaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7AF69" />
      <stop offset="50%" stop-color="#E7C98C" />
      <stop offset="100%" stop-color="#BA8E4A" />
    </linearGradient>
    <linearGradient id="brassStylus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#teakTable)" />

  <!-- Wooden Sattam Cover Boards & Stacked Palm Leaves -->
  <rect x="112" y="138" width="576" height="84" rx="10" fill="url(#palmLeaf)" stroke="#6B4C23" stroke-width="2" />
  <rect x="104" y="168" width="592" height="86" rx="10" fill="url(#palmLeaf)" stroke="#6B4C23" stroke-width="2" />
  <rect x="110" y="204" width="580" height="86" rx="10" fill="url(#palmLeaf)" stroke="#6B4C23" stroke-width="2" />

  <!-- Fine Inscribed Text Lines -->
  <g stroke="#3F2B13" stroke-width="2" stroke-dasharray="10 4 6 4 14 3" opacity="0.68">
    <line x1="255" y1="226" x2="545" y2="226" />
    <line x1="255" y1="244" x2="545" y2="244" />
    <line x1="255" y1="262" x2="545" y2="262" />
    <line x1="255" y1="186" x2="545" y2="186" />
  </g>

  <!-- Punched Binding Holes & Crimson Silk Cord -->
  <circle cx="215" cy="247" r="9" fill="#2A190C" />
  <circle cx="585" cy="247" r="9" fill="#2A190C" />
  <path d="M215,128 L215,310 M585,128 L585,310" stroke="#B91C1C" stroke-width="6" stroke-linecap="round" />
  <circle cx="215" cy="306" r="14" fill="#991B1B" stroke="#FCA5A5" stroke-width="1.5" />

  <!-- Antique Brass Writing Stylus (Ezhuthani) -->
  <g transform="rotate(-7 410 385)">
    <polygon points="160,395 590,378 655,388 590,398 160,404" fill="url(#brassStylus)" stroke="#451A03" stroke-width="1.5" />
    <circle cx="156" cy="399" r="12" fill="#D97706" stroke="#FDE68A" stroke-width="2" />
  </g>
</svg>

