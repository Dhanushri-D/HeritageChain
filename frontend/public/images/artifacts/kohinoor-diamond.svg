<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Koh-i-Noor Diamond Museum Display">
  <defs>
    <radialGradient id="velvetBg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#21354A" />
      <stop offset="55%" stop-color="#12212E" />
      <stop offset="100%" stop-color="#091118" />
    </radialGradient>
    <radialGradient id="spotGlow" cx="50%" cy="46%" r="38%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="50%" stop-color="#94C2C1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#12212E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2EFF7" />
      <stop offset="100%" stop-color="#9BBBD4" />
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F7FC" />
      <stop offset="50%" stop-color="#BDD4E7" />
      <stop offset="100%" stop-color="#769AB8" />
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8C4DC" />
      <stop offset="100%" stop-color="#4A6B88" />
    </linearGradient>
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#EA9940" />
      <stop offset="100%" stop-color="#9A5B13" />
    </linearGradient>
    <filter id="gemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#02060A" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#velvetBg)" />
  <ellipse cx="400" cy="260" rx="340" ry="200" fill="url(#spotGlow)" />

  <!-- Silk Cushion -->
  <ellipse cx="400" cy="340" rx="235" ry="72" fill="#0B1520" stroke="#2D4A63" stroke-width="2" />
  <ellipse cx="400" cy="332" rx="210" ry="56" fill="#172A3D" stroke="#EA9940" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle Gold Royal Setting Rim -->
  <ellipse cx="400" cy="245" rx="142" ry="172" fill="none" stroke="url(#goldBezel)" stroke-width="6" opacity="0.88" filter="url(#gemShadow)" />

  <!-- Brilliant Oval Diamond Facets -->
  <g filter="url(#gemShadow)">
    <!-- Outer Crown Facets -->
    <polygon points="400,76 462,92 508,136 534,196 538,245 534,294 508,354 462,398 400,414 338,398 292,354 266,294 262,245 266,196 292,136 338,92" fill="url(#facetMid)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Star & Bezel Facet Segments -->
    <polygon points="400,76 436,125 400,145 364,125" fill="#FFFFFF" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="400,76 462,92 478,150 436,125" fill="url(#facetLight)" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="462,92 508,136 498,186 478,150" fill="url(#facetDark)" stroke="#CFE3F2" stroke-width="1" />
    <polygon points="508,136 534,196 502,226 498,186" fill="url(#facetLight)" stroke="#FFFFFF" stroke-width="1" />
    <polygon points="534,196 538,245 504,245 502,226" fill="#FFFFFF" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="538,245 534,294 502,264 504,245" fill="url(#facetDark)" stroke="#CFE3F2" stroke-width="1" />
    <polygon points="534,294 508,354 498,304 502,264" fill="url(#facetMid)" stroke="#FFFFFF" stroke-width="1" />
    <polygon points="508,354 462,398 478,340 498,304" fill="url(#facetLight)" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="462,398 400,414 436,365 478,340" fill="url(#facetDark)" stroke="#CFE3F2" stroke-width="1" />
    <polygon points="400,414 338,398 364,365 400,345 436,365" fill="#FFFFFF" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="338,398 292,354 322,340 364,365" fill="url(#facetLight)" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="292,354 266,294 302,304 322,340" fill="url(#facetDark)" stroke="#CFE3F2" stroke-width="1" />
    <polygon points="266,294 262,245 296,245 302,304" fill="#FFFFFF" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="262,245 266,196 298,226 296,245" fill="url(#facetMid)" stroke="#FFFFFF" stroke-width="1" />
    <polygon points="266,196 292,136 302,186 298,226" fill="url(#facetLight)" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="292,136 338,92 322,150 302,186" fill="url(#facetDark)" stroke="#CFE3F2" stroke-width="1" />
    <polygon points="338,92 400,76 364,125 322,150" fill="url(#facetLight)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Inner Crown Facets -->
    <polygon points="400,145 436,125 478,150 456,190 400,175" fill="#EAF4FC" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="478,150 498,186 502,226 472,245 456,190" fill="#BBD5EA" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="502,226 504,245 502,264 472,245" fill="#FFFFFF" stroke="#B6CFE2" stroke-width="1" />
    <polygon points="502,264 498,304 478,340 456,300 472,245" fill="#8FB1CE" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="478,340 436,365 400,345 400,315 456,300" fill="#E6F2FB" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="400,345 364,365 322,340 344,300 400,315" fill="#C4DCF0" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="322,340 302,304 298,264 328,245 344,300" fill="#FFFFFF" stroke="#B6CFE2" stroke-width="1.2" />
    <polygon points="298,264 296,245 298,226 328,245" fill="#A5C3DC" stroke="#FFFFFF" stroke-width="1" />
    <polygon points="298,226 302,186 322,150 344,190 328,245" fill="#EDF6FC" stroke="#FFFFFF" stroke-width="1.2" />
    <polygon points="322,150 364,125 400,145 400,175 344,190" fill="#9BBBD6" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Central Octagonal Table -->
    <polygon points="400,175 456,190 472,245 456,300 400,315 344,300 328,245 344,190" fill="url(#facetLight)" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="400,175 456,190 400,245 344,190" fill="#FFFFFF" fill-opacity="0.65" />
    <polygon points="472,245 456,300 400,245" fill="#9EC0DB" fill-opacity="0.55" />
    <polygon points="328,245 344,300 400,245" fill="#FFFFFF" fill-opacity="0.45" />
  </g>

  <!-- Crisp Light Refraction Sparkles -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="344" y1="190" x2="344" y2="162" stroke-width="2" opacity="0.9" />
    <line x1="330" y1="176" x2="358" y2="176" stroke-width="2" opacity="0.9" />
    <line x1="485" y1="158" x2="485" y2="136" stroke-width="1.8" opacity="0.85" />
    <line x1="474" y1="147" x2="496" y2="147" stroke-width="1.8" opacity="0.85" />
    <line x1="398" y1="245" x2="398" y2="225" stroke-width="1.6" opacity="0.8" />
    <line x1="388" y1="235" x2="408" y2="235" stroke-width="1.6" opacity="0.8" />
  </g>
</svg>

